<style>
/* Layout: one-column phone app with a bottom tab bar; the pointed Hebrew is the hero, stem markers in argaman red, conjugation prefixes in gold */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #e2e7ee;
  --fg: #182030;
  --muted: #586276;
  --line: #cfd6e0;
  --accent: #253f86;       /* techelet blue: UI */
  --accent-ink: #ffffff;
  --accent-soft: #dbe3f6;
  --mark: #9b2448;         /* argaman: stem markers */
  --pre: #8a5a00;          /* gold: conjugation prefixes */
  --good: #1c7a52; --good-soft: #d6efe3; --bad: #b2362b; --bad-soft: #f7dcd8;
  --font-he: "Noto Serif Hebrew", "SBL Hebrew", "Times New Roman", serif;
  --font-display: "Gentium Book Plus", "Gentium Plus", Georgia, serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131b; --surface: #171d29; --surface-2: #212938; --fg: #e8ecf3; --muted: #9aa4b8; --line: #2c3547;
    --accent: #8fa8f0; --accent-ink: #0d1324; --accent-soft: #22305a; --mark: #f08aa5; --pre: #e6b45a;
    --good: #55cf98; --good-soft: #163428; --bad: #ff8b7d; --bad-soft: #3c1f1f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131b; --surface: #171d29; --surface-2: #212938; --fg: #e8ecf3; --muted: #9aa4b8; --line: #2c3547;
  --accent: #8fa8f0; --accent-ink: #0d1324; --accent-soft: #22305a; --mark: #f08aa5; --pre: #e6b45a;
  --good: #55cf98; --good-soft: #163428; --bad: #ff8b7d; --bad-soft: #3c1f1f; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 640px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: 2rem; font-weight: 700; }
h2 { font-size: 1.4rem; font-weight: 700; }
h3 { font-size: 1.12rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--pre); outline-offset: 2px; }
.eyebrow { font-size: 0.74rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.he { font-family: var(--font-he); direction: rtl; unicode-bidi: isolate; font-weight: 400; }
.tr { font-family: var(--font-display); font-style: italic; }
.m { color: var(--mark); font-weight: 700; }
.p { color: var(--pre); font-weight: 700; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: baseline; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; }
.brand .he { font-size: 1.5rem; color: var(--mark); }
.pill { display: inline-flex; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
nav.tabs button { background: none; border: 0; display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px; font-size: 0.74rem; font-weight: 700; color: var(--muted); }
nav.tabs button .he { font-size: 1.1rem; line-height: 1.25; }
nav.tabs button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

main section { display: grid; gap: 16px; padding-block: 6px 24px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 0.92rem; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; background: var(--accent); color: var(--accent-ink); min-height: 46px; }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
.btn.block { width: 100%; }
.feedback { padding: 12px 14px; border-radius: 12px; font-weight: 700; }
.feedback.ok { background: var(--good-soft); color: var(--good); }
.feedback.no { background: var(--bad-soft); color: var(--bad); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.85rem; }

.root-card { display: grid; gap: 4px; justify-items: start; }
.root-card .he { font-size: 3rem; line-height: 1.1; letter-spacing: 0.08em; }
.stem-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.stem-head .he { font-size: 1.6rem; }
.forms { display: grid; gap: 4px; }
.form-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.form-row:last-child { border-bottom: 0; }
.form-row .he { font-size: 2rem; line-height: 1.3; grid-row: span 2; text-align: right; min-width: 6.5rem; }
.form-row .na { font-family: var(--font-body); direction: ltr; font-size: 0.9rem; color: var(--muted); grid-row: span 2; min-width: 6.5rem; text-align: right; }

.slots { display: grid; gap: 8px; }
.slot { display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: left; border: 2px dashed var(--line); background: var(--surface); border-radius: 14px; padding: 10px 14px; min-height: 66px; }
.slot.active { border-color: var(--accent); border-style: solid; }
.slot.filled { border-style: solid; border-color: var(--good); background: var(--good-soft); cursor: default; }
.slot .he { font-size: 1.7rem; }
.slot .q { font-size: 1.4rem; color: var(--muted); }
.pool { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.pool .chip { font-size: 1.5rem; padding: 6px 14px; }
.pool .chip.wrong { border-color: var(--bad); background: var(--bad-soft); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.para { border-collapse: collapse; min-width: 100%; }
table.para th, table.para td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: right; white-space: nowrap; }
table.para thead th { position: sticky; top: 0; background: var(--accent); color: var(--accent-ink); font-size: 0.8rem; padding: 8px 10px; }
table.para tbody th { font-size: 0.78rem; color: var(--muted); text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; }
table.para td .he { font-size: 1.35rem; }
table.para td.on { background: var(--accent-soft); }
.cellbtn { background: none; border: 0; padding: 4px 2px; border-radius: 8px; }
.detail-he { font-size: 2rem; }
.opts.pgn { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
.stem-list { display: grid; gap: 10px; }
.stem-item { display: grid; grid-template-columns: 4.2rem minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; padding: 12px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.stem-he { font-size: 1.5rem; color: var(--mark); text-align: center; }
.bar { display: block; height: 6px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--good); }
.flash .big-he { font-size: 3rem; }
.cue { display: grid; gap: 4px; background: var(--surface-2); border-radius: var(--r); padding: 10px 14px; }
.cue .he { font-size: 1.15rem; }
select { width: 100%; font: inherit; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.wrapchips { display: flex; flex-wrap: wrap; gap: 8px; }
.focus summary { cursor: pointer; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.linkbtn { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 2px 4px; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; }
.opt .he { font-size: 1.15rem; }
.opt.right { background: var(--good-soft); border-color: var(--good); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.big-he { font-size: 3rem; line-height: 1.3; text-align: center; }

.flash { min-height: 230px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); display: grid; align-content: center; justify-items: center; gap: 8px; padding: 24px; text-align: center; cursor: pointer; }
.flash.back { background: var(--accent-soft); border-color: transparent; }
.flash .he { font-size: 3.2rem; line-height: 1.3; }
.rate { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.vocab-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.vocab-row .he { font-size: 1.6rem; grid-row: span 2; min-width: 4.5rem; text-align: right; }
.vocab-row:last-child { border-bottom: 0; }
ul.src { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
@media (prefers-reduced-motion: no-preference) { .slot, .chip, .opt { transition: background .15s, border-color .15s; } }

/* Dark mode: pastel highlights blend into the light text, so use brighter, more saturated colors. */
@media (prefers-color-scheme: dark) {
:root:not([data-theme="light"]) .m { color: #ff5c86; text-shadow: 0 0 1px currentColor; }
:root:not([data-theme="light"]) .p { color: #ffc933; text-shadow: 0 0 1px currentColor; }
}
:root[data-theme="dark"] .m { color: #ff5c86; text-shadow: 0 0 1px currentColor; }
:root[data-theme="dark"] .p { color: #ffc933; text-shadow: 0 0 1px currentColor; }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="he" lang="he">שֹׁרֶשׁ</span>Shoresh</div>

</div>

  <button data-tab="drill"><span class="he" lang="he">תַּרְגִּיל</span>Drill</button>
  <button data-tab="vocab"><span class="he" lang="he">מִלִּים</span>Vocab</button>
  <button data-tab="sources"><span class="he" lang="he">מְקוֹרוֹת</span>Sources</button>
</nav>

<script>
"use strict";
/* ================= SOURCES ================= */
const SRC = {

  wpt:   ["Wikipedia: Tetragrammaton", "https://en.wikipedia.org/wiki/Tetragrammaton"],

/* ================= PARADIGM (Logos "Hebrew Paradigms" strong verb chart, root ק־ט־ל) ================= */
// Rows and stem order follow the Logos chart. Cells use standard pointing (Logos prints them without dagesh).
// "-" = no form in this stem; "a/b" = the chart gives two forms.
const CONJ = [
  { id: "perf", name: "Perfect", pgn: ["3ms", "3fs", "2ms", "2fs", "1cs", "3cp", "2mp", "2fp", "1cp"] },
  { id: "impf", name: "Imperfect", pgn: ["3ms", "3fs", "2ms", "2fs", "1cs", "3mp", "3fp", "2mp", "2fp", "1cp"] },
  { id: "impv", name: "Imperative", pgn: ["ms", "fs", "mp", "fp"] },
  { id: "infc", name: "Infinitive construct", pgn: [""] },
  { id: "infa", name: "Infinitive absolute", pgn: [""] },
  { id: "ptca", name: "Participle active", pgn: ["ms"] },
  { id: "ptcp", name: "Participle passive", pgn: ["ms"] },
  { id: "wayy", name: "Wayyiqtol", pgn: ["3ms"] },
  { id: "juss", name: "Jussive", pgn: ["3ms"] },
  { id: "coh", name: "Cohortative", pgn: ["1cs"] }
];
const PREFIXED = ["impf", "wayy", "juss", "coh"];
const STEMS = [
  { id: "qal", name: "Qal", he: "קַל", voice: "Simple active",
    marks: "No added letters: the basic stem the others build on. Perfect has a-vowels (קָטַל), the imperfect an ō before the last root letter (יִקְטֹל), and the active participle an ō after the first (קֹטֵל).",
    src: ["logos", "bbh12", "uhgI"],
    f: { perf: "קָטַל קָטְלָה קָטַלְתָּ קָטַלְתְּ קָטַלְתִּי קָטְלוּ קְטַלְתֶּם קְטַלְתֶּן קָטַלְנוּ",

         impv: "קְטֹל קִטְלִי קִטְלוּ קְטֹלְנָה", infc: "קְטֹל", infa: "קָטוֹל", ptca: "קֹטֵל", ptcp: "קָטוּל",
         wayy: "וַיִּקְטֹל", juss: "יִקְטֹל", coh: "אֶקְטְלָה" } },
  { id: "niphal", name: "Niphal", he: "נִפְעַל", voice: "Simple passive or reflexive",
    marks: "A nun prefix (נִ) in the perfect and participle. After another prefix the nun assimilates and doubles the first root letter (יִקָּטֵל); the imperative and infinitive use הִ instead.",
    src: ["logos", "uhgN", "beck", "crv"],
    f: { perf: "נִקְטַל נִקְטְלָה נִקְטַלְתָּ נִקְטַלְתְּ נִקְטַלְתִּי נִקְטְלוּ נִקְטַלְתֶּם נִקְטַלְתֶּן נִקְטַלְנוּ",

function colorForm(word, si, cid) {

    let k = "";
    if (q < 0 || t < 0 || l < 0) k = "";

      const w = base[0] === "ו" ? 1 : 0;
      if (i < w) k = "p";
      else if (PREFIXED.includes(cid) && i === w) k = "p";

    else if (i === t && doubled && c.includes("ּ")) k = "m";
    else if (i === q && sid === "niphal" && c.includes("ּ")) k = "m";

    return k ? `<span class="${k}">${c}</span>` : c;
  }).join("");
}

  const head = `
    <div class="row between"><button class="linkbtn" id="toStems">‹ All stems</button><span class="small muted">${st.learned} of ${st.total} learned</span></div>
    <div class="stem-head"><div><h2>${s.name}</h2><span class="muted">${esc(s.voice)}</span></div><span class="he" lang="he">${s.he}</span></div>
    <div class="cue"><span class="eyebrow">Look for</span><p class="small">${STEM_CUE[s.id]}</p></div>
    <div class="row between"><span class="small muted">Colors on the front of the card</span><button class="chip" id="colorToggle" aria-pressed="${S.cardColor !== false}">${S.cardColor !== false ? "On" : "Off"}</button></div>`;
  const c = sub.queue[0];
  if (!c) {
    el.innerHTML = head + `
      <div class="card" style="display:grid;gap:10px;justify-items:center;text-align:center;padding-block:28px">
        <h2>${sub.done ? "Session done" : "Nothing due"}</h2>
        <p class="muted">${sub.done ? `You reviewed ${sub.done} card${sub.done > 1 ? "s" : ""}. ` : ""}${st.fresh ? `${st.fresh} new ${s.name} forms are still waiting.` : `You've seen every ${s.name} form. Missed ones come back when they're due.`}</p>
        <div class="row" style="justify-content:center">${st.fresh ? `<button class="btn" id="more">Learn ${Math.min(NEW_PER_SESSION, st.fresh)} more</button>` : ""}<button class="btn ghost" id="all">Review all ${st.total}</button></div>
      </div>
      <div class="card" style="display:grid;gap:8px"><h3>How to spot the ${s.name}</h3><p class="small">${heInline(s.marks)}</p>${LEGEND}</div>`;
    $("#toStems", el).onclick = () => { sub = {}; render(); };
    $("#colorToggle", el).onclick = () => { S.cardColor = S.cardColor === false; save(); render(); };
    const more = $("#more", el); if (more) more.onclick = () => { sub.queue = stemDeck(si, dir).filter(x => isNew(x.key)).slice(0, NEW_PER_SESSION); sub.done = 0; render(); };
    $("#all", el).onclick = () => { sub.queue = shuffle(stemDeck(si, dir).filter(x => !isNew(x.key))); if (!sub.queue.length) sub.queue = stemDeck(si, dir).slice(0, NEW_PER_SESSION); sub.done = 0; render(); };
    return;
  }
  const [cid0, pi0] = c.cells[0];
  const labels = c.cells.map(([cid, pi]) => parseLabel(cid, pi));
  const front = dir === "recognize"
    ? `<span class="eyebrow">What form is this?</span>${S.cardColor !== false ? formHTML(si, cid0, pi0, "big-he") : `<span class="he big-he" lang="he">${c.word}</span>`}`
    : `<span class="eyebrow">Write the Hebrew</span><h2>${s.name} ${esc(labels[0].toLowerCase())}</h2><span class="muted">“${esc(gloss(si, cid0, pi0))}”</span>`;
  const back = dir === "recognize"
    ? `${formHTML(si, cid0, pi0, "big-he")}<h3>${labels.map(esc).join(" or ")}</h3><span class="muted">“${c.cells.map(([cid, pi]) => esc(gloss(si, cid, pi))).filter((g, i, a) => a.indexOf(g) === i).join("” or “")}”</span>`
    : `${formHTML(si, cid0, pi0, "big-he")}<span class="muted">${esc(labels[0])} · “${esc(gloss(si, cid0, pi0))}”</span>`;
  el.innerHTML = head + `
    <p class="small muted">${sub.queue.length} to go${isNew(c.key) ? " · new card" : ""}</p>
    <div class="flash${sub.flipped ? " back" : ""}" id="card" role="button" tabindex="0" aria-label="Tap to flip">
      ${sub.flipped ? back : front + `<span class="small muted">Tap to check</span>`}
    </div>
    ${LEGEND}
    ${sub.flipped ? `<div class="rate"><button class="btn ghost" data-r="0">Didn't know it</button><button class="btn" data-r="1">Knew it</button></div>` : ""}`;
  $("#toStems", el).onclick = () => { sub = {}; render(); };
  $("#colorToggle", el).onclick = () => { S.cardColor = S.cardColor === false; save(); render(); };
  const card = $("#card", el);
  const flip = () => { if (!sub.flipped) { sub.flipped = true; render(); } };
  card.onclick = flip;
  card.onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); } };
  el.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
    const ok = b.dataset.r === "1", box = ok ? Math.min(GAP.length - 1, boxOf(c.key) + 1) : 0;
    if (!S.cards) S.cards = {};
    S.cards[c.key] = { box, due: ok ? Date.now() + GAP[box] * DAY - 3600e3 : Date.now() };
    sub.queue.shift(); sub.done++;
    if (!ok) sub.queue.splice(Math.min(sub.queue.length, 3), 0, c);
    sub.flipped = false; point(ok ? 1 : 0); save(); render();
  });
}

/* ================= VOCAB VIEW ================= */
// Leitner boxes: a right answer moves a word up a box (seen less often), a miss sends it back to box 0.
const GAP = [0, 1, 3, 7, 21];
function dueWords() {
  const now = Date.now();
  return VOCAB.filter(w => { const b = S.boxes[w[0]]; return !b || b.due <= now; });
}
function viewVocab(el) {
  if (!sub.mode) sub.mode = "cards";
  const known = VOCAB.filter(w => (S.boxes[w[0]]?.box || 0) >= 2).length;
  const head = `
    <div><span class="eyebrow">Millim · ${VOCAB.length} high-frequency words</span><h1>Vocab</h1></div>
    <div class="chips"><button class="chip" data-vm="cards" aria-pressed="${sub.mode === "cards"}">Flashcards</button><button class="chip" data-vm="list" aria-pressed="${sub.mode === "list"}">Word list</button></div>`;
  if (sub.mode === "list") {
    el.innerHTML = head + `<p class="small muted">${known} of ${VOCAB.length} words reviewed well at least twice.</p>
      <div class="card" style="padding-block:4px">${VOCAB.map(w => `<div class="vocab-row"><span class="he" lang="he">${w[0]}</span>
        <span><b>${esc(w[2])}</b> · <span class="tr">${w[1]}</span>${w[3] ? `<span class="small muted"> · ${esc(w[3])}</span>` : ""}</span>
        <span class="small muted">Source: ${srcLink(w[4])}</span></div>`).join("")}</div>`;
  } else {
    if (!sub.queue) sub.queue = shuffle(dueWords());
    const w = sub.queue[0];
    if (!w) {
      el.innerHTML = head + `<div class="card" style="display:grid;gap:10px;text-align:center;justify-items:center;padding-block:32px"><h2>All caught up</h2>
        <p class="muted">Every word is scheduled for later. You can review ahead now, or drill the stems.</p>
        <div class="row" style="justify-content:center"><button class="btn" id="aheadV">Review ahead (${Math.min(20, VOCAB.length)})</button><button class="btn ghost" id="toDrill">Go to the drill</button></div></div>`;
      // Study ahead: the words coming due soonest first.
      $("#aheadV", el).onclick = () => { sub.queue = VOCAB.slice().sort((a, b) => (S.boxes[a[0]]?.due || 0) - (S.boxes[b[0]]?.due || 0)).slice(0, 20); sub.flipped = false; render(); };
      $("#toDrill", el).onclick = () => go("drill");
    } else {
      el.innerHTML = head + `<p class="small muted">${sub.queue.length} to review · ${known} learned</p>
        <div class="flash${sub.flipped ? " back" : ""}" id="card" role="button" tabindex="0" aria-label="Tap to flip">
          <span class="he" lang="he">${w[0]}</span>
          ${sub.flipped ? `<span class="tr">${w[1]}</span><h2>${esc(w[2])}</h2>${w[3] ? `<p class="small muted">${esc(w[3])}</p>` : ""}<p class="small muted">Source: ${srcLink(w[4])}</p>` : `<span class="small muted">Tap to see the meaning</span>`}
        </div>
        ${sub.flipped ? `<div class="rate"><button class="btn ghost" data-r="0">Didn't know it</button><button class="btn" data-r="1">Knew it</button></div>` : ""}`;
      const card = $("#card", el);
      const flip = () => { if (!sub.flipped) { sub.flipped = true; render(); } };
      card.onclick = e => { if (!e.target.closest("a")) flip(); };
      card.onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); } };
      el.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
        const ok = b.dataset.r === "1", cur = S.boxes[w[0]]?.box || 0, box = ok ? Math.min(GAP.length - 1, cur + 1) : 0;
        S.boxes[w[0]] = { box, due: ok ? Date.now() + GAP[box] * DAY - 3600e3 : Date.now() };
        sub.queue.shift(); if (!ok) sub.queue.splice(Math.min(sub.queue.length, 3), 0, w);
        sub.flipped = false; point(ok ? 1 : 0); save(); render();
      });
    }
  }
  el.querySelectorAll("[data-vm]").forEach(b => b.onclick = () => { sub.mode = b.dataset.vm; render(); });
}

/* ================= SOURCES VIEW ================= */
function viewSources(el) {
  el.innerHTML = `
    <div><span class="eyebrow">Mekorot</span><h1>Sources</h1></div>
    <p>Every stem form and vocabulary gloss in this app was checked against at least one of these references, and each one names its source. Words I couldn't confirm were left out.</p>
    <div class="card" style="display:grid;gap:8px"><h3>Based on the Logos chart</h3>
      <p class="small">The Stems tab follows the strong-verb grid of Logos's free ${srcLink("logos")}: the same stem order, sections, persons and alternate forms. Three deliberate differences:</p>
      <ul class="src small"><li>Logos prints the forms without the dagesh. Here it's restored, because the doubled letter is how you spot the Piel, Pual and Hithpael (and the Niphal imperfect).</li>
        <li>Logos prints the Hithpael perfect 1cs with a ת prefix (תִתְקַטַּלְתִּי); the correct form is הִתְקַטַּלְתִּי.</li>
        <li>Logos prints the Niphal imperative mp with a ח (חִקָּטְלוּ); the correct form is הִקָּטְלוּ.</li></ul>
      <p class="small muted">The chart's small stress marks are left out. English glosses are added by this app.</p></div>
    <div class="card" style="display:grid;gap:10px"><h3>Stem paradigm</h3>
      <p class="small muted">The paradigm uses the root ק־ט־ל, the standard model verb in grammars such as Pratico & Van Pelt. Where sources differ, the app follows the common textbook form and says so: the Hophal also appears with a u-vowel (הֻקְטַל), and the Pual and Hophal have no imperative or infinitive construct.</p>
      <ul class="src">${["logos", "bbh12", "bbh26", "bbh30", "bbh33", "bbh34", "uhgS", "uhgN", "uhgP", "uhgH", "uhgT", "uhgI", "beck", "ginH", "crv"].map(k => `<li class="small">${srcLink(k)}</li>`).join("")}</ul></div>
    <div class="card" style="display:grid;gap:10px"><h3>Vocabulary</h3>
      <ul class="src">${["ginV", "ah14", "eheb", "hbr", "bhp", "bhq", "blb", "wpt", "firm", "bh3318", "bhv", "shes"].map(k => `<li class="small">${srcLink(k)}</li>`).join("")}</ul></div>
    <p class="small muted">For deeper study, the standard references are a full grammar (Pratico & Van Pelt, Joüon–Muraoka, Waltke–O'Connor) and a lexicon (BDB, HALOT).</p>`;
}

go("stems");
</script>

if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
