<style>
/* Layout: one-column phone app with a bottom tab bar; the pointed Hebrew is the hero, stem markers in argaman red, conjugation prefixes in gold */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #e2e7ee;
  --fg: #182030;
  --muted: #586276;
  --line: #cfd6e0;
  --accent: #253f86;       /* techelet blue: UI */
  --accent-ink: #ffffff;
  --accent-soft: #dbe3f6;
  --mark: #9b2448;         /* argaman: stem markers */
  --pre: #8a5a00;          /* gold: conjugation prefixes */
  --good: #1c7a52; --good-soft: #d6efe3; --bad: #b2362b; --bad-soft: #f7dcd8;
  --font-he: "Noto Serif Hebrew", "SBL Hebrew", "Times New Roman", serif;
  --font-display: "Gentium Book Plus", "Gentium Plus", Georgia, serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131b; --surface: #171d29; --surface-2: #212938; --fg: #e8ecf3; --muted: #9aa4b8; --line: #2c3547;
    --accent: #8fa8f0; --accent-ink: #0d1324; --accent-soft: #22305a; --mark: #f08aa5; --pre: #e6b45a;
    --good: #55cf98; --good-soft: #163428; --bad: #ff8b7d; --bad-soft: #3c1f1f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131b; --surface: #171d29; --surface-2: #212938; --fg: #e8ecf3; --muted: #9aa4b8; --line: #2c3547;
  --accent: #8fa8f0; --accent-ink: #0d1324; --accent-soft: #22305a; --mark: #f08aa5; --pre: #e6b45a;
  --good: #55cf98; --good-soft: #163428; --bad: #ff8b7d; --bad-soft: #3c1f1f; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 640px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: 2rem; font-weight: 700; }
h2 { font-size: 1.4rem; font-weight: 700; }
h3 { font-size: 1.12rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--pre); outline-offset: 2px; }
.eyebrow { font-size: 0.74rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.he { font-family: var(--font-he); direction: rtl; unicode-bidi: isolate; font-weight: 400; }
.tr { font-family: var(--font-display); font-style: italic; }
.m { color: var(--mark); font-weight: 700; }
.p { color: var(--pre); font-weight: 700; }
.hx { position: relative; display: inline-block; }
.hx span { font-weight: inherit; }
.hx-top { position: absolute; inset: 0; pointer-events: none; user-select: none; -webkit-user-select: none; white-space: nowrap; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: baseline; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; }
.brand .he { font-size: 1.5rem; color: var(--mark); }
.pill { display: inline-flex; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(6, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
nav.tabs button { background: none; border: 0; display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px; font-size: 0.74rem; font-weight: 700; color: var(--muted); }
nav.tabs button .he { font-size: 1.1rem; line-height: 1.25; }
nav.tabs button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

main section { display: grid; gap: 16px; padding-block: 6px 24px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 0.92rem; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; background: var(--accent); color: var(--accent-ink); min-height: 46px; }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
.btn.block { width: 100%; }
.feedback { padding: 12px 14px; border-radius: 12px; font-weight: 700; }
.feedback.ok { background: var(--good-soft); color: var(--good); }
.feedback.no { background: var(--bad-soft); color: var(--bad); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.85rem; }

.root-card { display: grid; gap: 4px; justify-items: start; }
.root-card .he { font-size: 3rem; line-height: 1.1; letter-spacing: 0.08em; }
.stem-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.stem-head .he { font-size: 1.6rem; }
.forms { display: grid; gap: 4px; }
.form-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.form-row:last-child { border-bottom: 0; }
.form-row .he { font-size: 2rem; line-height: 1.3; grid-row: span 2; text-align: right; min-width: 6.5rem; }
.form-row .na { font-family: var(--font-body); direction: ltr; font-size: 0.9rem; color: var(--muted); grid-row: span 2; min-width: 6.5rem; text-align: right; }

.slots { display: grid; gap: 8px; }
.slot { display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: left; border: 2px dashed var(--line); background: var(--surface); border-radius: 14px; padding: 10px 14px; min-height: 66px; }
.slot.active { border-color: var(--accent); border-style: solid; }
.slot.filled { border-style: solid; border-color: var(--good); background: var(--good-soft); cursor: default; }
.slot .he { font-size: 1.7rem; }
.slot .q { font-size: 1.4rem; color: var(--muted); }
.pool { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.pool .chip { font-size: 1.5rem; padding: 6px 14px; }
.pool .chip.wrong { border-color: var(--bad); background: var(--bad-soft); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.para { border-collapse: collapse; min-width: 100%; }
table.para th, table.para td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: right; white-space: nowrap; }
table.para thead th { position: sticky; top: 0; background: var(--accent); color: var(--accent-ink); font-size: 0.8rem; padding: 8px 10px; }
table.para tbody th { font-size: 0.78rem; color: var(--muted); text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; }
table.para td .he { font-size: 1.35rem; }
table.para td.on { background: var(--accent-soft); }
.cellbtn { background: none; border: 0; padding: 4px 2px; border-radius: 8px; }
.pop { position: fixed; z-index: 20; display: grid; gap: 6px; padding: 16px 16px 14px; box-shadow: 0 12px 32px rgba(0,0,0,.28); }
.pop-x { position: absolute; top: 4px; right: 6px; width: 36px; height: 36px; border: 0; background: none; color: var(--muted); font-size: 1.5rem; line-height: 1; }
.pop > .row { padding-right: 28px; }
.detail-he { font-size: 2rem; }
.opts.pgn { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
.stem-list { display: grid; gap: 10px; }
.stem-item { display: grid; grid-template-columns: 4.2rem minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; padding: 12px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.stem-he { font-size: 1.5rem; color: var(--mark); text-align: center; }
.bar { display: block; height: 6px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--good); }
.flash .big-he { font-size: 3rem; }
.cue { display: grid; gap: 4px; background: var(--surface-2); border-radius: var(--r); padding: 10px 14px; }
.cue .he { font-size: 1.15rem; }
select { width: 100%; font: inherit; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.wrapchips { display: flex; flex-wrap: wrap; gap: 8px; }
.focus summary { cursor: pointer; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.linkbtn { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 2px 4px; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; }
.opt .he { font-size: 1.15rem; }
.opt.right { background: var(--good-soft); border-color: var(--good); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.big-he { font-size: 3rem; line-height: 1.3; text-align: center; }

.flash { min-height: 230px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); display: grid; align-content: center; justify-items: center; gap: 8px; padding: 24px; text-align: center; cursor: pointer; }
.flash.back { background: var(--accent-soft); border-color: transparent; }
.flash .he { font-size: 3.2rem; line-height: 1.3; }
.rate { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.vocab-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.vocab-row .he { font-size: 1.6rem; grid-row: span 2; min-width: 4.5rem; text-align: right; }
.vocab-row:last-child { border-bottom: 0; }
.verse-back, section > .linkbtn { justify-self: start; }
.ep-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface-2); border: 0; border-radius: 12px; padding: 12px 14px; color: var(--fg); }
div.ep-row { background: none; border: 1px dashed var(--line); }
.sec-h { margin-top: 8px; }
.verse { display: grid; gap: 8px; }
.vtext { font-size: 1.75rem; line-height: 2.1; margin: 0; text-align: right; }
.vtext.blur { filter: blur(6px); opacity: 0.55; user-select: none; -webkit-user-select: none; pointer-events: none; }
.bw { font: inherit; color: inherit; background: none; border: 0; padding: 0 2px; border-radius: 8px; cursor: pointer; }
.bw.on { background: var(--accent-soft); }
.sof, .para { color: var(--muted); }
.para { font-size: 1.1rem; }
.vtr { margin: 0; }
.wdetail { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.wpart { display: grid; grid-template-columns: 3.2rem minmax(0, 1fr); gap: 10px; align-items: center; }
.wpart > .he { font-size: 1.4rem; text-align: center; }
.flash .ctx { font-size: 2rem; }
.lextools { display: grid; gap: 8px; justify-items: start; text-align: left; width: 100%; }
details.bdb { width: 100%; }
details.bdb summary { cursor: pointer; font-weight: 700; color: var(--accent); }
.bdb-body { max-height: 55vh; overflow: auto; font-size: 0.9rem; line-height: 1.55; padding: 8px 2px 4px; }
.bdb-body .he { font-size: 1.15em; }
.bsense { margin-left: 0.9rem; }
.bdb-body > .bsense { margin-left: 0; margin-top: 4px; }
.bn { font-weight: 700; color: var(--muted); }
.stem { font-variant: small-caps; font-weight: 700; color: var(--mark); }
.ref { color: var(--muted); white-space: nowrap; }
.chip.logos { font-size: 0.85rem; }


ul.src { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
@media (prefers-reduced-motion: no-preference) { .slot, .chip, .opt { transition: background .15s, border-color .15s; } }

/* Dark mode: pastel highlights blend into the light text, so use brighter, more saturated colors. */
@media (prefers-color-scheme: dark) {
:root:not([data-theme="light"]) .m { color: #ff5c86; text-shadow: 0 0 1px currentColor; }
:root:not([data-theme="light"]) .p { color: #ffc933; text-shadow: 0 0 1px currentColor; }
}
:root[data-theme="dark"] .m { color: #ff5c86; text-shadow: 0 0 1px currentColor; }
:root[data-theme="dark"] .p { color: #ffc933; text-shadow: 0 0 1px currentColor; }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="he" lang="he">שֹׁרֶשׁ</span>Shoresh</div>
    <span class="pill" id="scorePill">0 today</span>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

  <button data-tab="drill"><span class="he" lang="he">תַּרְגִּיל</span>Drill</button>
  <button data-tab="vocab"><span class="he" lang="he">מִלִּים</span>Vocab</button>

</nav>

<script>
"use strict";
/* ================= SOURCES ================= */
const SRC = {
  logos: ["Logos Bible Software, Hebrew Paradigms chart (strong verbs)", "https://www.logos.com/product/6338/greek-and-hebrew-paradigm-charts"],
  bbh12: ["Pratico & Van Pelt, Basics of Biblical Hebrew, ch. 12 (verb introduction)", "https://hebrew.billmounce.com/BasicsBiblicalHebrew-12.pdf"],
  bbh26: ["Pratico & Van Pelt, Basics of Biblical Hebrew, ch. 26 (Piel)", "https://hebrew.billmounce.com/BasicsBiblicalHebrew-26.pdf"],
  bbh30: ["Pratico & Van Pelt, Basics of Biblical Hebrew, ch. 30 (Hiphil)", "https://hebrew.billmounce.com/BasicsBiblicalHebrew-30.pdf"],
  bbh33: ["Pratico & Van Pelt, Basics of Biblical Hebrew, ch. 33 (Hophal)", "https://hebrew.billmounce.com/BasicsBiblicalHebrew-33.pdf"],
  bbh34: ["Pratico & Van Pelt, Basics of Biblical Hebrew, ch. 34 (Hithpael)", "https://hebrew.billmounce.com/BasicsBiblicalHebrew-34.pdf"],
  uhgS:  ["unfoldingWord Hebrew Grammar: Stem formation", "https://uhg.readthedocs.io/en/latest/stem.html"],
  uhgN:  ["unfoldingWord Hebrew Grammar: Niphal", "https://uhg.readthedocs.io/en/latest/stem_niphal.html"],
  uhgP:  ["unfoldingWord Hebrew Grammar: Piel", "https://uhg.readthedocs.io/en/latest/stem_piel.html"],
  uhgH:  ["unfoldingWord Hebrew Grammar: Hiphil", "https://uhg.readthedocs.io/en/latest/stem_hiphil.html"],
  uhgT:  ["unfoldingWord Hebrew Grammar: Hithpael", "https://uhg.readthedocs.io/en/latest/stem_hithpael.html"],
  uhgI:  ["unfoldingWord Hebrew Grammar: Infinitive construct", "https://uhg.readthedocs.io/en/latest/infinitive_construct.html"],
  beck:  ["Beckman, Reading Biblical Hebrew: Infinitive construct", "https://hebrewsyntax.org/rbh1/RBH_19_infinitive_construct.pdf"],
  ginH:  ["Ginoskos: Causative verbs (Hiphil, Hophal)", "https://ginoskos.com/biblical-hebrew/causative-verbs-hiphil-hophal"],
  crv:   ["Bratcher, Hebrew verb stems chart (CRI/Voice)", "https://mail.crivoice.org/pdf/heb-stems.pdf"],
  ginV:  ["Ginoskos: Hebrew basic vocabulary (700 most frequent words)", "https://ginoskos.com/exercises?tags=82&action=detail&id=26&l=3&p%5Bsize%5D=64"],
  ah14:  ["Ancient Hebrew Research Center: Learn Biblical Hebrew, lesson 14", "https://www.ancient-hebrew.org/learn/learn-biblical-hebrew-14.htm"],
  eheb:  ["eHebrew.net: Biblical Hebrew word list", "https://ehebrew.net/biblical-hebrew-word-list-free-download/"],
  hbr:   ["Holy Branches: 20 frequently used Hebrew words in the Bible", "https://holybranches.com/20-frequently-used-hebrew-words-in-the-bible/"],
  bhp:   ["BiblicalHebrew.org: Particles and small words", "https://biblicalhebrew.org/particles-small-words-in-biblical-hebrew.aspx"],
  bhq:   ["BiblicalHebrew.org: Basic prepositions", "https://biblicalhebrew.org/basic-prepositions-in-biblical-hebrew-form-function-and-meaning.aspx"],
  blb:   ["Blue Letter Bible: Strong's H430, ʾĕlōhîm", "https://www.blueletterbible.org/lexicon/h430/kjv/wlc/0-1/"],
  wpt:   ["Wikipedia: Tetragrammaton", "https://en.wikipedia.org/wiki/Tetragrammaton"],
  firm:  ["FIRM: 38 Hebrew words every Christian should know", "https://firmisrael.org/learn/hebrew-words-every-christian-should-know-a-glossary/"],
  bh3318:["Bible Hub: Strong's 3318, yāṣāʾ", "https://biblehub.com/hebrew/3318.htm"],
  bhv:   ["BiblicalHebrew.org: Hebrew verbs occurring 500+ times", "https://biblicalhebrew.org/hebrew-verbs-5000.aspx"],
  shes:  ["She's So Scripture: Yashav (יָשַׁב)", "https://shessoscripture.com/p/yashav-abide-hebrew-word-study"]
};
function srcLink(k) { const s = SRC[k]; return s ? `<a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a>` : ""; }

/* ================= PARADIGM (Logos "Hebrew Paradigms" strong verb chart, root ק־ט־ל) ================= */
// Rows and stem order follow the Logos chart. Cells use standard pointing (Logos prints them without dagesh).
// "-" = no form in this stem; "a/b" = the chart gives two forms.
const CONJ = [
  { id: "perf", name: "Perfect", pgn: ["3ms", "3fs", "2ms", "2fs", "1cs", "3cp", "2mp", "2fp", "1cp"] },
  { id: "impf", name: "Imperfect", pgn: ["3ms", "3fs", "2ms", "2fs", "1cs", "3mp", "3fp", "2mp", "2fp", "1cp"] },
  { id: "impv", name: "Imperative", pgn: ["ms", "fs", "mp", "fp"] },
  { id: "infc", name: "Infinitive construct", pgn: [""] },
  { id: "infa", name: "Infinitive absolute", pgn: [""] },
  { id: "ptca", name: "Participle active", pgn: ["ms"] },
  { id: "ptcp", name: "Participle passive", pgn: ["ms"] },
  { id: "wayy", name: "Wayyiqtol", pgn: ["3ms"] },
  { id: "juss", name: "Jussive", pgn: ["3ms"] },
  { id: "coh", name: "Cohortative", pgn: ["1cs"] }
];
const PREFIXED = ["impf", "wayy", "juss", "coh"];
const STEMS = [
  { id: "qal", name: "Qal", he: "קַל", voice: "Simple active",
    marks: "No added letters: the basic stem the others build on. Perfect has a-vowels (קָטַל), the imperfect an ō before the last root letter (יִקְטֹל), and the active participle an ō after the first (קֹטֵל).",

pan class=\"bn\">2.</span> The <span class=\"he\" lang=\"he\">ו</span> consecutive</div> <div class=\"bsense\"><span class=\"bn\">3.</span> With a <i>voluntative</i> (cohort. or juss.) <span class=\"he\" lang=\"he\">וְ</span> expresses an intention <b>that</b> or <b>so that</b></div> <div class=\"bsense\"><span class=\"bn\">4.</span> It often expresses an informal inference, or consequence, <b>so</b>, <b>then</b>, esp. at the beginning of a speech</div> <div class=\"bsense\"><span class=\"bn\">5.</span> <span class=\"he\" lang=\"he\">ו</span> introduces the <i>predicate</i> or <i>apodosis</i></div>"],"H9003":["88","<span class=\"he\" lang=\"he\">בְּ</span> <i>prep.</i> <div class=\"bsense\"><b>in</b> (Moab. <span class=\"he\" lang=\"he\">בּ</span>, Syr. <span class=\"muted\">Syriac</span>, Ar. <span class=\"muted\">Arabic</span>, Eth. <span class=\"muted\">Ethiopic</span>) before tone-syllables in certain cases (Ges §102.2) <span class=\"he\" lang=\"he\">בָּ</span>, with suff. <span class=\"he\" lang=\"he\">בִּי</span>; <span class=\"he\" lang=\"he\">בְּךָ</span> (<span class=\"ref\">Ex 7:29</span> <span class=\"ref\">2 S 22:30</span> <span class=\"ref\">ψ 141:8</span> <span class=\"he\" lang=\"he\">בְּכָה</span>) in pause and fem. <span class=\"he\" lang=\"he\">בָּךְ</span>; <span class=\"he\" lang=\"he\">בֹּו</span> (once, <span class=\"ref\">Je 17:24</span> Kt <span class=\"he\" lang=\"he\">בֹּה</span>) <span class=\"he\" lang=\"he\">בָּהּ</span>; <span class=\"he\" lang=\"he\">בָּנוּ</span>; <span class=\"he\" lang=\"he\">בָּכֶם</span>, [<span class=\"he\" lang=\"he\">בָּכֶן</span>]; <span class=\"he\" lang=\"he\">בָּהֶם</span>, <span class=\"he\" lang=\"he\">בָּם</span> [also <span class=\"he\" lang=\"he\">בָּהֵ֫מָּה</span> †<span class=\"ref\">Ex 30:4</span> <span class=\"ref\">36:1</span> <span class=\"ref\">Hb 1:16</span>], <span class=\"he\" lang=\"he\">בָּהֵן</span> †<span class=\"ref\">I S 31:7</span> <span class=\"ref\">Is 38:16</span> <span class=\"ref\">Ez 42:14</span> [15 times <span class=\"he\" lang=\"he\">בָּהֵן</span> (Fr MM 235), and thrice, <span class=\"ref\">Lv 5:22</span> <span class=\"ref\">Nu 13:19</span> <span class=\"ref\">Je 5:17</span>, <span class=\"he\" lang=\"he\">בָּהֵ֫נָּה</span>] Prep. denoting properly <b>in</b>, Gk. <span class=\"muted\">ἐν</span>, but applied in many derived and fig. significations. The senses expressed by <span class=\"he\" lang=\"he\">בְּ</span> are grouped by the Rabbis in three classes, <span class=\"he\" lang=\"he\">בֵּית הַכּלִי</span> <span class=\"muted\">Beth vasculi</span>, <span class=\"he\" lang=\"he\">בֵּית הַדִּיבּוּק וְהַגְּגִיעָה</span> <span class=\"muted\">Beth coniunctionis et viciniae</span>, <span class=\"he\" lang=\"he\">בֵּית הָעֵזֶר</span> <span class=\"muted\">Beth auxilii</span>; and the same arrangement may be followed here, though the limits between the three classes are not clearly defined, and they sometimes overlap one another. <div class=\"bsense\"><span class=\"bn\">I.</span> <b>In</b>: <div class=\"bsense\"><span class=\"bn\">1.</span> strictly, of position <b>in</b> a place (which often is expressed more precisely by <span class=\"he\" lang=\"he\">בְּתוֹךְ ,בְּקֶרֶב</span>), as <span class=\"he\" lang=\"he\">בַּבַּיִת</span> <b>in</b> the house, <span class=\"he\" lang=\"he\">בָּעִיר</span> <b>in</b> the city, <span class=\"he\" lang=\"he\">בַּדּוּד</span>, <b>in</b> the pot, <span class=\"he\" lang=\"he\">בָּאָרֶץ</span> <b>in</b> the land, etc. constantly. Heb. idiom also says <span class=\"he\" lang=\"he\">בָּהָר</span> <b>in</b> the mountain <span class=\"ref\">Ex 24:18</span> etc., even in cases where we could hardly avoid saying <i>on</i>, as <span class=\"ref\">I K 11:7</span> <span class=\"ref\">19:11</span>: so <span class=\"he\" lang=\"he\">בְּחֹרֵב</span> <span class=\"ref\">Dt 1:16</span> al.; <span class=\"he\" lang=\"he\">בְּרֹאשׁ הָהָר</span> <span class=\"ref\">Ex 24:17</span> <span class=\"ref\">ψ 72:16</span>. Preceded by a verb of motion (esp. <span class=\"he\" lang=\"he\">עָבַר</span>) <span class=\"he\" lang=\"he\">בְּ</span> = <b>through</b>, as <span class=\"ref\">Gn 12:6</span> and Abram passed through <span class=\"he\" lang=\"he\">בָּאָרֶץ</span> <b>in</b> the land = passed through it, <span class=\"ref\">13:17</span> <span class=\"ref\">2 S 24:2</span> +; <b>in</b> (= <b>through</b>) a gate, <span class=\"ref\">Is 62:10</span> <span class=\"ref\">Je 17:19</span> <span class=\"ref\">Mi 2:13</span>. Fig. to speak <span class=\"he\" lang=\"he\">בְּאַזְנֵי</span> <b>in</b> the ears of . . . ; to be good (<i>or</i> evil, etc.) <span class=\"he\" lang=\"he\">בּעֵינֵי</span> <b>in</b> the eyes of. . ,</div> <div class=\"bsense\"><span class=\"bn\">2.</span> of presence in the midst of a multitude, <b>among</b>, <span class=\"ref\">Ex 14:28</span> there was not left <span class=\"he\" lang=\"he\">בָּהֶם</span> <b>among</b> them even one, <span class=\"ref\">Lv 26:36</span> <span class=\"ref\">2 S 15:31</span> Ahitophel <span class=\"he\" lang=\"he\">בַּקֹשְׁרִים</span> is <b>among</b> the conspirators, <span class=\"ref\">2 K 18:5</span> <span class=\"he\" lang=\"he\">בְּכֹל מַלְכֵי יְהוּדָה</span>. So <span class=\"he\" lang=\"he\">בְּךָ</span> <b>in</b> thee (of Israel, coll.) <span class=\"ref\">Dt 7:14</span> <span class=\"ref\">15:4</span>, <span class=\"ref\">7</span> <span class=\"ref\">18:10</span> <span class=\"ref\">23:11</span> <span class=\"ref\">28:54</span> (diff. from <span class=\"he\" lang=\"he\">עִמָּ֑ךְ</span> <i>beside</i> thee <span class=\"ref\">Lv 25:35</span>).—Spec. <div class=\"bsense\"><span class=\"bn\">a.</span> of an individ., implying eminency among: <span class=\"ref\">Jos 14:15</span> <span class=\"ref\">Je 46:18</span> Tabor <b>among</b> the mountains, <span class=\"ref\">49:15</span> <span class=\"ref\">Pr 30:30</span> <span class=\"ref\">Ct 1:6</span> <span class=\"he\" lang=\"he\">הַיָּפָה בַגָּשִׁים</span> the fair one (= the fairest) <b>among</b> women, <span class=\"ref\">La 1:1</span>: cf. <span class=\"ref\">Luke 1:42</span>. On <span class=\"ref\">I S 17:12</span> v. Dr.</div> <div class=\"bsense\"><span class=\"bn\">b.</span> hence with some verbs, when the action refers to only a part of the object, as <span class=\"he\" lang=\"he\">הִכָּה בְּ</span> to smite among . . . i.e. to smite some of . . . (diff. from <span class=\"he\" lang=\"he\">הִכָּה</span> with accus.); <span class=\"he\" lang=\"he\">הָרַג בְּ</span> <span class=\"ref\">ψ 78:31</span>; <span class=\"he\" lang=\"he\">נָשָׂא בְּ</span> to bear <b>in</b>, i.e. to share in bearing, <span class=\"ref\">Nu 11:17</span> al.; <span class=\"he\" lang=\"he\">בָּנָה בְּ</span> to build <b>in</b> or at <span class=\"ref\">Zc 6:15</span> <span class=\"ref\">Ne 4:4</span>; <span class=\"he\" lang=\"he\">עָשָׂה בְּ</span> <span class=\"ref\">Ex 5:9</span>; <span class=\"he\" lang=\"he\">אָמֵל בְּ</span> to labour <b>on</b> <span class=\"ref\">Jon 4:10</span>; <span class=\"he\" lang=\"he\">אָכַל בְּ</span> to eat or drink <b>of</b> <span class=\"ref\">Ju 13:16</span> <span class=\"ref\">Pr 9:5</span>; <span class=\"he\" lang=\"he\">חָלַק בְּ</span> to give a share <b>in</b> <span class=\"ref\">Jb 39:17</span>.</div> <div class=\"bsense\"><span class=\"bn\">c.</span> specifying the parts of which a whole consists (esp. in P) <span class=\"ref\">Gn 7:21</span> <span class=\"ref\">8:17</span> <span class=\"ref\">9:10</span>.<span class=\"ref\">16</span> <span class=\"ref\">17:23</span> <span class=\"ref\">Ex 12:19</span> <span class=\"ref\">Nu 31:11</span>.<span class=\"ref\">25</span> <span class=\"ref\">Ho 4:3</span>.</div> <div class=\"bsense\"><span class=\"bn\">3.</span> with ref. to the limits enclosing a space, <b>within</b>: <span class=\"ref\">Ex 20:10</span> <span class=\"he\" lang=\"he\">בִּשְׁעָרֶיךָ</span> <b>within</b> thy gates, <span class=\"ref\">Is 56:5</span> <span class=\"he\" lang=\"he\">בְּחוֹמוֹתַי</span> <b>within</b> my walls. </div> <div class=\"bsense\"><span class=\"bn\">4.</span> often pregn. with verbs of motion, when the movement <b>to</b> a place results in rest <b>in</b> it, <b>into</b>: after <span class=\"he\" lang=\"he\">בָּא</span> <span class=\"ref\">Gn 19:8</span> <span class=\"ref\">Is 19:23</span>; <span class=\"he\" lang=\"he\">נָתַן</span> <span class=\"ref\">Gn 27:17</span>; <span class=\"he\" lang=\"he\">שָׁלַח</span> <i>to send</i> <span class=\"ref\">Lv 16:22</span>; <b>in among</b> <span class=\"ref\">Jos 23:7</span>.12 <span class=\"ref\">1 K 11:2</span>.—<span class=\"ref\">Ho 12:7</span> (an extreme case) <span class=\"he\" lang=\"he\">שׁוּב בְּ</span> to return (and rest) <b>in</b> thy God, <span class=\"ref\">1 Sa 16:3</span> (unless <span class=\"he\" lang=\"he\">לַזָּבַ֑ח</span> should be read, as v. 7).—<span class=\"he\" lang=\"he\">עַיִן בְּעַיִן</span> (with) eye (looking) <b>into</b> eye † <span class=\"ref\">Nu 14:14</span> <span class=\"ref\">Is 52:8</span>; <span class=\"he\" lang=\"he\">פָּנִים בְּפָנִים</span> †Dt 5:4; <span class=\"he\" lang=\"he\">עֵינֵי פְ&#x27; בְּ</span> the eyes of . . . are <b>upon</b>, both in favourable <span class=\"ref\">Dt 11:12</span> <span class=\"ref\">ψ 101:6</span>) and hostile <span class=\"ref\">Am 9:8</span> <span class=\"ref\">Jb 7:8</span>) sense. </div> <div class=\"bsense\"><span class=\"bn\">5.</span> applied to <i>time</i>, as <span class=\"ref\">Gn 1:1</span> <span class=\"he\" lang=\"he\">בְּרֵאשִׁית</span> <b>in</b> the beginning; <span class=\"ref\">2:2</span> <span class=\"he\" lang=\"he\">בַּיֹּום הַשְּׁבִיעִי</span> <b>on</b> the seventh day; <span class=\"ref\">Ju 10:8</span> <span class=\"he\" lang=\"he\">בַּשְָּׁנָה הַהִיא</span> <b>in</b> that year; &amp; constantly. </div> <div class=\"bsense\"><span class=\"bn\">6.</span> of a state or condition, whether material or mental, <b>in</b> which an action takes place: so oft., <span class=\"he\" lang=\"he\">בְּשָׁלֹום</span> <b>in</b> peace <span class=\"r /* ================= STATE ================= */
const DAY = 864e5, today = () => new Date().toISOString().slice(0, 10), LS = "shoresh.v1";
const blank = () => ({ boxes: {}, days: {} });
let S = blank();
try { const raw = localStorage.getItem(LS); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
let doc = null, saveT = null, saving = false, again = false;
function save() {
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
  if (doc) { clearTimeout(saveT); saveT = setTimeout(flush, 1200); }
}
async function flush() {
  if (!doc) return;
  if (saving) { again = true; return; }
  saving = true;
  try { await doc.set({ state: JSON.stringify(S), at: Date.now() }); } catch (e) {}
  saving = false;
  if (again) { again = false; flush(); }
}
(async () => {
  try {
    if (!window.claude?.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.collection("data/users/" + id).doc("progress");
    const snap = await ref.get();
    doc = ref;
    const r = snap.exists ? snap.data() : null;
    if (r && r.state) {
      const remote = JSON.parse(r.state);
      const size = x => Object.keys(x.boxes || {}).length + Object.keys(x.cards || {}).length + Object.keys(x.bible || {}).length;
      if (size(remote) >= size(S)) { S = Object.assign(blank(), remote); render(); } else flush();
    } else if (Object.keys(S.boxes).length || Object.keys(S.cards || {}).length) flush();
  } catch (e) {}
})();
function point(n) { S.days[today()] = (S.days[today()] || 0) + n; save(); pill(); }
function pill() { $("#scorePill").textContent = (S.days[today()] || 0) + " today"; }

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];

function go(t) { document.querySelectorAll(".pop").forEach(p => p.remove()); tab = t; sub = {}; document.querySelectorAll("nav.tabs button").forEach(b => b.dataset.tab === t ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current")); render(); window.scrollTo(0, 0); }
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => go(b.dataset.tab));

  const gns = x => [G[x[0]], N[x[1]], x[2] === "c" ? "construct" : ""].filter(Boolean).join(" ");
  const pgn = x => [{ 1: "1st", 2: "2nd", 3: "3rd" }[x[0]], G[x[1]], N[x[2]]].filter(Boolean).join(" ");

          <p class="small vtr">${esc(v[4])}</p>${sub.sel ? wordDetail(v[3][sub.sel[1]]) : `<p class="small muted">Read it aloud, then tap any word to check it.</p>`}</div>`
      : `<div class="card" style="text-align:center;display:grid;gap:8px;padding-block:28px"><h2>Review done</h2><p class="muted">Those words are scheduled for later.</p></div>`) + `
      <div style="display:grid;gap:8px">${nextVi >= 0 ? `<button class="btn block" id="nextV">Next: learn the words for ${V[nextVi][0]}</button>` : ""}<button class="btn ghost block" id="toEp">Back to ${ep.title}</button></div>`;
    wireLex(el);
    $("#stopStudy", el).onclick = $("#toEp", el).onclick = () => { sub = { ep: sub.ep }; render(); };
    const nv = $("#nextV", el); if (nv) nv.onclick = () => { sub = { ep: sub.ep, vi: nextVi, queue: verseKeys(V[nextVi]).filter(x => !learned(x)), flipped: false }; render(); window.scrollTo(0, 0); };
    el.querySelectorAll("[data-bw]").forEach(b => b.onclick = () => { const [vi, wi] = b.dataset.bw.split(",").map(Number); sub.sel = sub.sel && sub.sel[1] === wi ? null : [vi, wi]; render(); });
    return;
  }
  const L = BLEX[k], use = firstUse(ep, k, sub.vi), isNewCard = !learned(k);
  const ctx = use ? `<span class="small muted">In ${book.name} ${use.v[0]}:</span><span class="he ctx" lang="he">${wordHL(use.w, k)}</span>` : "";
  el.innerHTML = back + `
    <p class="small muted">${sub.queue.length} to go${isNewCard ? " · new word" : ""}${sub.vi != null ? ` · for ${book.name} ${V[sub.vi][0]}` : ""}</p>
    <div class="flash${sub.flipped ? " back" : ""}" id="card" role="button" tabindex="0" aria-label="Tap to flip">
      <span class="he" lang="he">${L[0]}</span>
      ${sub.flipped ? `<h2>${esc(L[3])}</h2><span class="small muted">${esc(POS_LABEL(L[2]))}</span>${ctx}
          ${use ? `<span class="small">“${esc(use.w[1].replace(/\s*\/\s*/g, " "))}” · ${esc(parseCode(use.e[3], L[2]))}</span>` : ""}${lexTools(k)}`
        : `${ctx}<span class="small muted">What does it mean? Tap to check</span>`}
    </div>
    ${sub.flipped ? `<div class="rate"><button class="btn ghost" data-r="0">Didn't know it</button><button class="btn" data-r="1">Knew it</button></div>` : ""}`;
  wireLex(el);
  $("#stopStudy", el).onclick = () => { sub = { ep: sub.ep }; render(); };
  const card = $("#card", el), flip = () => { if (!sub.flipped) { sub.flipped = true; render(); } };
  card.onclick = flip;
  card.onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); } };
  el.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
    const ok = b.dataset.r === "1", cur = S.bible[k] || { box: 0 }, box = ok ? Math.min(GAP.length - 1, (cur.learned ? cur.box : 0) + 1) : 0;
    S.bible[k] = { box, due: ok ? Date.now() + GAP[box] * DAY - 3600e3 : Date.now(), learned: cur.learned || ok };
    sub.queue.shift();
    if (!ok) sub.queue.splice(Math.min(sub.queue.length, 3), 0, k);
    sub.flipped = false; sub.sel = null; point(ok ? 1 : 0); save(); render();
  });
}

/* ================= SOURCES VIEW ================= */
function viewSources(el) {
  el.innerHTML = `
    <div><span class="eyebrow">Mekorot</span><h1>Sources</h1></div>
    <p>Every stem form and vocabulary gloss in this app was checked against at least one of these references, and each one names its source. Words I couldn't confirm were left out.</p>
    <div class="card" style="display:grid;gap:8px"><h3>Based on the Logos chart</h3>
      <p class="small">The Stems tab follows the strong-verb grid of Logos's free ${srcLink("logos")}: the same stem order, sections, persons and alternate forms. Three deliberate differences:</p>
      <ul class="src small"><li>Logos prints the forms without the dagesh. Here it's restored, because the doubled letter is how you spot the Piel, Pual and Hithpael (and the Niphal imperfect).</li>
        <li>Logos prints the Hithpael perfect 1cs with a ת prefix (תִתְקַטַּלְתִּי); the correct form is הִתְקַטַּלְתִּי.</li>
        <li>Logos prints the Niphal imperative mp with a ח (חִקָּטְלוּ); the correct form is הִקָּטְלוּ.</li></ul>
      <p class="small muted">The chart's small stress marks are left out. English glosses are added by this app.</p></div>
    <div class="card" style="display:grid;gap:10px"><h3>Stem paradigm</h3>
      <p class="small muted">The paradigm uses the root ק־ט־ל, the standard model verb in grammars such as Pratico & Van Pelt. Where sources differ, the app follows the common textbook form and says so: the Hophal also appears with a u-vowel (הֻקְטַל), and the Pual and Hophal have no imperative or infinitive construct.</p>
      <ul class="src">${["logos", "bbh12", "bbh26", "bbh30", "bbh33", "bbh34", "uhgS", "uhgN", "uhgP", "uhgH", "uhgT", "uhgI", "beck", "ginH", "crv"].map(k => `<li class="small">${srcLink(k)}</li>`).join("")}</ul></div>
    <div class="card" style="display:grid;gap:8px"><h3>Hebrew Bible text</h3>
      <p class="small">The Bible tab uses the Leningrad Codex, the manuscript printed in the Biblia Hebraica Stuttgartensia (BHS). The words, their English glosses, lexical forms and parsing come from <a href="https://github.com/STEPBible/STEPBible-Data" target="_blank" rel="noopener">STEPBible's Translators Amalgamated Hebrew OT (TAHOT)</a> by Tyndale House Cambridge (CC BY 4.0). TAHOT takes its text from the Westminster Leningrad Codex and checks it against the electronic BHS. Short glosses come from STEPBible's TBESH lexicon (CC BY 4.0). Each word also shows its <a href="https://github.com/openscriptures/HebrewLexicon" target="_blank" rel="noopener">Brown–Driver–Briggs</a> entry with the BDB page number (public domain; Open Scriptures' digital edition, which keeps BDB's definitions and outline but not every citation).</p>
      <p class="small">HALOT is the fuller modern lexicon, but it is licensed by Brill and can't be included. The “Copy for HALOT in Logos” button copies the dictionary form so you can search for it in your own copy.</p>
      <p class="small muted">Changes made here: cantillation marks are hidden unless you turn on Accents; Genesis 2:4 is split at the atnach for 2:4a; word senses of the same lexeme are merged into one card; glosses are shortened; the verse translations are the app's own. BHS itself (its apparatus and layout) is copyrighted by the Deutsche Bibelgesellschaft and is not reproduced.</p></div>
    <div class="card" style="display:grid;gap:10px"><h3>Vocabulary</h3>
      <ul class="src">${["ginV", "ah14", "eheb", "hbr", "bhp", "bhq", "blb", "wpt", "firm", "bh3318", "bhv", "shes"].map(k => `<li class="small">${srcLink(k)}</li>`).join("")}</ul></div>
    <p class="small muted">For deeper study, the standard references are a full grammar (Pratico & Van Pelt, Joüon–Muraoka, Waltke–O'Connor) and a lexicon (BDB, HALOT).</p>`;
}

go("stems");
</script>
